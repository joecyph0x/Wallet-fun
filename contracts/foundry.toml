[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
remappings = ["forge-std/=lib/forge-std/src/"]
# WalletRegistryV3Testnet.testnetList starts with "test", so forge would fuzz it as a test.
# Only files under test/ are tests.
no_match_path = "src/**"
# The deploy script reads the seed file and, only when WRITE_DEPLOYMENT=1,
# writes the address book the web app and the keeper share.
fs_permissions = [
    { access = "read", path = "./script/whales.json" },
    { access = "read-write", path = "./deployments" },
]

[rpc_endpoints]
hyperevm_testnet = "https://rpc.hyperliquid-testnet.xyz/evm"

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 20
fail_on_revert = false

# `forge test` compiles this profile and runs files in test/ only.
# script/DeploySeason0.s.sol is not executed here and is not part of CI.
