<style>
:root{--bg:#06060b;--txt:#e9e9ff;--mut:#8a8aa8;--tail:#39ff88;--fade:#ff2e88;--y:#ffe14d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:'Space Grotesk',system-ui,sans-serif}
html{background-image:radial-gradient(circle at 18% -8%,#39ff8824,transparent 42%),radial-gradient(circle at 88% 0%,#ff2e8822,transparent 40%)}
body{min-height:100vh;min-height:100dvh}
#bgwaves{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(6,6,11,.2) 0%,rgba(6,6,11,.05) 38%,rgba(6,6,11,.55) 100%)}
.stage{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px 92px;text-align:center}
.badge{font:700 12px 'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--y);border:1px solid #ffe14d77;background:#ffe14d14;border-radius:999px;padding:7px 14px;box-shadow:0 0 18px #ffe14d33}
.brand{display:flex;align-items:center;gap:14px;margin:22px 0 8px}
.mark{width:84px;height:84px;animation:float 4.6s ease-in-out infinite,glow 3.2s ease-in-out infinite}
.word{font-family:Bungee,cursive;font-size:clamp(18px,3vw,28px);letter-spacing:.02em;background:linear-gradient(90deg,var(--tail),#3ee0ff,var(--fade));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 16px #39ff8844)}
h1{font-family:Bungee,cursive;font-weight:400;font-size:clamp(46px,9vw,104px);line-height:.92;margin:10px 0 0;letter-spacing:.01em}
h1 .g{color:var(--tail);text-shadow:0 0 22px #39ff8888}
h1 .p{color:var(--fade);text-shadow:0 0 22px #ff2e8888;animation:flick 5.5s ease-in-out infinite}
.sub{margin:14px 0 0;color:#f4f4ff;font-size:clamp(16px,2.4vw,22px);text-shadow:0 2px 16px #06060b,0 0 8px #06060b}
.follow{margin-top:26px;display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:#04140c;background:var(--tail);font-weight:700;font-size:16px;border-radius:999px;padding:14px 26px;box-shadow:0 0 22px #39ff88aa,0 0 64px #39ff8844;animation:pulse 2.8s ease-in-out infinite}
.follow svg{width:18px;height:18px;fill:currentColor}
.follow:hover{background:var(--fade);color:#fff;box-shadow:0 0 22px #ff2e88cc,0 0 64px #ff2e8844}
.follow:focus-visible{outline:2px solid #fff;outline-offset:4px}
.ticker{position:fixed;left:0;right:0;bottom:0;z-index:3;overflow:hidden;padding:14px 0;background:linear-gradient(180deg,transparent,rgba(6,6,11,.82) 28%);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;gap:0;width:max-content;animation:marquee 42s linear infinite}
.ticker:hover .track{animation-play-state:paused}
.tick{display:inline-flex;align-items:center;gap:10px;padding:0 22px;font:700 14px 'JetBrains Mono',monospace;color:#d7d7f0;white-space:nowrap}
.tick i{width:7px;height:7px;border-radius:99px;background:var(--tail);box-shadow:0 0 8px var(--tail)}
.tick:nth-child(odd) i{background:var(--fade);box-shadow:0 0 8px var(--fade)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 10px #39ff8888) drop-shadow(0 0 18px #ff2e8855)}50%{filter:drop-shadow(0 0 18px #39ff88) drop-shadow(0 0 28px #ff2e88aa)}}
@keyframes flick{0%,72%,100%{color:#ff2e88;text-shadow:0 0 22px #ff2e8888}80%,88%{color:#39ff88;text-shadow:0 0 26px #39ff88cc}}
@keyframes pulse{0%,100%{box-shadow:0 0 22px #39ff88aa,0 0 64px #39ff8844}50%{box-shadow:0 0 32px #39ff88ee,0 0 80px #39ff8866}}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media(max-width:600px){
  .stage{padding:22px 16px 108px}
  .brand{flex-direction:column;gap:8px}
  .mark{width:72px;height:72px}
  h1{font-size:clamp(40px,14vw,64px)}
  .follow{width:min(100%,320px);justify-content:center}
}
@media(prefers-reduced-motion:reduce){
  .mark,.track,h1 .p,.follow{animation:none}
  .ticker:hover .track{animation:none}
}
</style>
</head>
<body>
<canvas id="bgwaves" aria-hidden="true"></canvas>

      <rect x="392" y="456" width="250" height="86" rx="22" fill="#10101a" stroke="#39FF88" stroke-width="8"/>

<script>
(function(){
  var names=["Machi Big Brother","BobbyBigSize","HLP Vault","2 frères 2 fauves","NMTD","SilkBtc","we love u jeff","cat hot wallet","PURRINA","perpfumbler","James Wynn"];
  var track=document.getElementById("track");
  var html=names.concat(names).map(function(n){return '<span class="tick"><i></i>'+n.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</span>'}).join("");
  track.innerHTML=html;
})();
(function(){
  var cv=document.getElementById("bgwaves");if(!cv)return;var ctx=cv.getContext("2d");
  var RM=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  var TAIL=new Path2D("M 456 494 C 476 450 494 410 492 372 C 430 350 360 300 338 220 C 330 185 332 150 344 132 C 370 156 410 180 458 196 C 506 210 532 236 540 266 C 550 236 580 212 628 196 C 688 178 728 160 754 136 C 766 168 760 226 732 270 C 702 318 636 350 586 372 C 586 410 600 456 614 494 Z");
  var L=[{c:"40,70,150",y:.56,a:24,k:.0055,s:.18,al:.16,g:.22},{c:"255,46,136",y:.66,a:20,k:.0075,s:-.26,al:.07,g:.42},
         {c:"57,255,136",y:.76,a:18,k:.0095,s:.34,al:.06,g:.40},{c:"8,14,38",y:.86,a:16,k:.012,s:-.45,al:.72,g:.16}];
  var W=0,H=0,dpr=1,t=0,last=0,raf=0,drops=[],ripples=[],bubbles=[];
  var whale={state:"idle",x:0,t0:0,next:0,layer:2,flip:1};
  function size(){dpr=Math.min(1.5,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!bubbles.length)seedBubbles()}
  function seedBubbles(){bubbles=[];for(var i=0;i<16;i++)bubbles.push({x:Math.random()*Math.max(W,1),y:Math.random()*Math.max(H,1),r:1.5+Math.random()*4.5,s:10+Math.random()*26,a:.12+Math.random()*.28,c:i%2?"57,255,136":"255,46,136"})}
  var yAt=function(l,x){return H*l.y+Math.sin(x*l.k+t*l.s)*l.a+Math.sin(x*l.k*2.3-t*l.s*1.7+1.3)*l.a*.45};
  function crest(l){ctx.beginPath();for(var x=-10;x<=W+10;x+=8){var y=yAt(l,x);x<0?ctx.moveTo(x,y):ctx.lineTo(x,y)}}
  function drawLayer(l){
    crest(l);ctx.lineTo(W+10,H);ctx.lineTo(-10,H);ctx.closePath();
    var top=H*l.y-l.a*1.5,gr=ctx.createLinearGradient(0,top,0,H);
    gr.addColorStop(0,"rgba("+l.c+","+l.al+")");gr.addColorStop(1,"rgba("+l.c+","+(l.al*.35)+")");
    ctx.fillStyle=gr;ctx.fill();
    crest(l);ctx.strokeStyle="rgba("+l.c+","+(l.g*.22)+")";ctx.lineWidth=7;ctx.stroke();ctx.strokeStyle="rgba("+l.c+","+l.g+")";ctx.lineWidth=1.4;ctx.stroke();
  }
  function splash(x,y,n,up){for(var i=0;i<n;i++){var a=-Math.PI/2+(Math.random()-.5)*1.6,v=(up?3.2:2.2)+Math.random()*2.6;
    drops.push({x:x+(Math.random()-.5)*40,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:1.5+Math.random()*2.5,c:["255,255,255","57,255,136","255,46,136"][i%3],life:1})}
    ripples.push({x:x,y:y,r:6,life:1})}
  function pose(x,p,rot,flip){
    var l=L[whale.layer],h=Math.max(70,Math.min(150,H*.17)),s=h/362,cy=yAt(l,x);
    ctx.save();
    ctx.beginPath();ctx.moveTo(-10,-10);ctx.lineTo(W+10,-10);for(var px=W+10;px>=-10;px-=8)ctx.lineTo(px,yAt(l,px)+3);ctx.closePath();ctx.clip();
    ctx.translate(x,cy+(1-p)*h*1.1+6);ctx.rotate(rot*flip);ctx.scale(s*flip,s);ctx.translate(-541,-494);
    ctx.lineJoin="round";ctx.strokeStyle="#fff";ctx.lineWidth=70;ctx.stroke(TAIL);
    ctx.strokeStyle="#000";ctx.lineWidth=22;ctx.stroke(TAIL);ctx.fillStyle="#FF2E88";ctx.fill(TAIL);ctx.stroke(TAIL);
    ctx.restore();
  }
  function drawWhale(now){
    var l=L[whale.layer];
    if(whale.state==="idle"){if(now>whale.next){whale.state="up";whale.t0=now;whale.x=W*(Math.random()<.5?.14+Math.random()*.12:.74+Math.random()*.12);whale.flip=whale.x<W*.5?1:-1;splash(whale.x,yAt(l,whale.x),16,true)}return}
    var e=(now-whale.t0)/1000,RISE=1.1,HOLD=1.6,DIVE=1.0,p,rot;
    if(e<RISE){var q=e/RISE;p=1-Math.pow(1-q,3);rot=-.25*(1-q)}
    else if(e<RISE+HOLD){p=1+Math.sin((e-RISE)*3)*.03;rot=Math.sin((e-RISE)*2.2)*.07}
    else if(e<RISE+HOLD+DIVE){var d=(e-RISE-HOLD)/DIVE;p=1-d*d;rot=.35*d;if(!whale.dived&&d>.75){whale.dived=1;splash(whale.x,yAt(l,whale.x),22,false)}}
    else{whale.state="idle";whale.dived=0;whale.next=now+16000+Math.random()*14000;return}
    pose(whale.x,p,rot,whale.flip);
  }
  function drawFx(dt){
    var i;
    for(i=0;i<ripples.length;i++){var r=ripples[i];r.r+=1.6;r.life-=.025;ctx.strokeStyle="rgba(255,255,255,"+(Math.max(0,r.life)*.5)+")";ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(r.x,r.y+4,r.r*2.2,r.r*.45,0,0,Math.PI*2);ctx.stroke()}
    ripples=ripples.filter(function(r){return r.life>0});
    for(i=0;i<drops.length;i++){var d=drops[i];d.vy+=.16;d.x+=d.vx;d.y+=d.vy;d.life-=.018;ctx.fillStyle="rgba("+d.c+","+(Math.max(0,d.life)*.85)+")";ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill()}
    drops=drops.filter(function(d){return d.life>0&&d.y<H});
    for(i=0;i<bubbles.length;i++){var b=bubbles[i];b.y-=b.s*dt;if(b.y<-12){b.y=H+8;b.x=Math.random()*W}ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.strokeStyle="rgba("+b.c+","+b.a+")";ctx.lineWidth=1;ctx.stroke()}
  }
  function frame(now){
    raf=requestAnimationFrame(frame);
    if(now-last<33)return;
    var dt=Math.min(.1,(now-last)/1000);last=now;t+=dt;
    ctx.clearRect(0,0,W,H);
    for(var i=0;i<L.length;i++){drawLayer(L[i]);if(i===whale.layer)drawWhale(now)}
    drawFx(dt);
  }
  function still(){
    t=1.2;ctx.clearRect(0,0,W,H);L.forEach(drawLayer);
    pose(W*.62,.92,-.04,1);
    bubbles.forEach(function(b){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.strokeStyle="rgba("+b.c+","+b.a+")";ctx.stroke()});
  }
  size();addEventListener("resize",function(){size();if(RM)still()});
  if(RM){still();return}
  document.addEventListener("visibilitychange",function(){if(document.hidden){cancelAnimationFrame(raf);raf=0}else if(!raf){last=performance.now();raf=requestAnimationFrame(frame)}});
  raf=requestAnimationFrame(frame);
})();
</script>
</body>
</html>
