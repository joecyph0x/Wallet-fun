# whalewallet.fun Season 0 keeper. HyperEVM testnet only.
# The signing key is NOT here. Set it with: npx wrangler secret put KEEPER_PRIVATE_KEY
name = "whalewallet-keeper"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[triggers]
# v3: check every minute. A transaction is sent only when a market is due
# (lastSettleTs + EPOCH), so gas is still one settle pass per epoch.
# Epochs end at lastSettleTs + 600, not on the wall clock. If this run is
# within 30s before that boundary it waits until the boundary plus 20s
# (at most 50s) so the wait finishes before the next minute's run.
# Set PROTOCOL = "v2" and REGISTRY to the v2 address to return to v2.
crons = ["* * * * *"]

[vars]
PROTOCOL = "v3"
EPOCH_SEC = "600"
CHAIN_ID = "998"
RPC_URL = "https://rpc.hyperliquid-testnet.xyz/evm"
INFO_API = "https://api.hyperliquid-testnet.xyz/info"
# v3 registry proxy on testnet (deployments/testnet-v3.json). v2 was 0x9A00D44E7564004f8557bf7a780793c546ccd4a5.
REGISTRY = "0x896E8B5952f48205F032224311ba55D5C0a42F3F"
MIN_GAS_HYPE = "0.005"
IDLE_HEARTBEAT_SEC = "600"
HEARTBEAT_SEC = "60"
MAX_TX_PER_RUN = "2"
