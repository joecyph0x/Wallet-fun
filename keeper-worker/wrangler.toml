# whalewallet.fun Season 0 keeper. HyperEVM testnet only.
# The signing key is NOT here. Set it with: npx wrangler secret put KEEPER_PRIVATE_KEY
name = "whalewallet-keeper"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[triggers]
# v3: one settleMany pass every 10 minutes (Config.EPOCH). The v2 minute cron is gone.
# Epochs end at lastSettleTs + 600, not on :00/:10. */10 therefore fires a few
# seconds before the boundary. The scheduled handler waits until that boundary
# plus 20s, then sends the same single pass. Shifting the cron (1-59/10) would
# still land early once a settle itself takes a few seconds.
# Set PROTOCOL = "v2", REGISTRY to the v2 address, and add "* * * * *" back to return to v2.
crons = ["*/10 * * * *"]

[vars]
PROTOCOL = "v3"
EPOCH_SEC = "600"
CHAIN_ID = "998"
RPC_URL = "https://rpc.hyperliquid-testnet.xyz/evm"
INFO_API = "https://api.hyperliquid-testnet.xyz/info"
# v3 registry proxy on testnet (deployments/testnet-v3.json). v2 was 0x9A00D44E7564004f8557bf7a780793c546ccd4a5.
REGISTRY = "0x896E8B5952f48205F032224311ba55D5C0a42F3F"
MIN_GAS_HYPE = "0.005"
IDLE_HEARTBEAT_SEC = "600"
HEARTBEAT_SEC = "60"
MAX_TX_PER_RUN = "2"
