name: pages

# Publishes the static site in web/ only. No secrets.
# GitHub Pages is not turned on by this file. Joe enables it in the repo settings.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the coming-soon root and the unlisted app
        run: |
          mkdir -p _site
          cp web/index.html web/robots.txt _site/
          app=$(find web -mindepth 2 -maxdepth 2 -name index.html -printf '%h\n')
          test -n "$app"
          name=$(basename "$app")
          mkdir -p "_site/$name/config"
          cp "$app/index.html" "$app/chain.js" "$app/v3abi.js" "_site/$name/"
          cp -L "$app/config/testnet-v3.json" "_site/$name/config/testnet-v3.json"
          test -s _site/index.html
          test -s _site/robots.txt
          test -s "_site/$name/index.html"
          test -s "_site/$name/chain.js"
          test -s "_site/$name/v3abi.js"
          test -s "_site/$name/config/testnet-v3.json"
          test ! -e _site/chain.js
          test ! -e _site/v3abi.js
          test ! -e _site/config
          if grep -R -n -E 'PRIVATE_KEY|BEGIN OPENSSH PRIVATE|BEGIN EC PRIVATE' _site; then
            echo "refusing to publish a secret" >&2
            exit 1
          fi
          if grep -n "$name" _site/index.html _site/robots.txt; then
            echo "refusing to publish the app path on the public root" >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
